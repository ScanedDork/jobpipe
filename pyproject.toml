[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "jobpipe"
version = "0.1.0"
description = "Turn a job posting into a tailored resume, cover letter and ATS audit, and track applications."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "python-docx>=1.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
jobpipe = "jobpipe.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jobpipe"]

[tool.hatch.build.targets.wheel.force-include]
"prompts" = "jobpipe/prompts"
"templates" = "jobpipe/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]  # keep word lists as readable """...""".split() blocks
